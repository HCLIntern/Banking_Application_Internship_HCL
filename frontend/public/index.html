<!doctype html>
<html>
  <head>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digital Banking Frontend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji"; color: #0f172a; background:#f3f4f6; }

      .auth-layout { min-height: 100vh; display: flex; }
      .left-panel {
        flex: 1; min-width: 280px; color: #e5eefc; display: flex; flex-direction: column; padding: 32px;
        background: linear-gradient(135deg, #0c3b93 0%, #0e49b5 40%, #0b2d6b 100%);
      }
      .brand { display:flex; align-items:center; gap:10px; }
      .brand-badge { height:32px; width:32px; border-radius:8px; background: rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; font-weight:700; }
      .hero-title { margin:0; color:#fff; font-size:40px; line-height:1.15; letter-spacing:0.2px; }
      .hero-desc { margin-top:12px; max-width:420px; color:#dbe7ff; }
      .left-footer { opacity:.8; font-size:12px; }

      .right-wrap { flex:1; min-width:320px; display:flex; align-items:center; justify-content:center; padding:24px; }
      .right-card { width:100%; max-width:420px; background:#fff; padding:24px; border-radius:14px; box-shadow:0 12px 32px rgba(16,24,40,0.08); }
      .card-title { margin:0 0 6px; font-size:24px; color:#0f172a; }
      .card-sub { margin:0 0 16px; color:#64748b; }

      .tabs { background:#f1f5f9; border-radius:9999px; padding:4px; display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-bottom:16px; }
      .tab { border:none; border-radius:9999px; padding:8px 12px; cursor:pointer; font-weight:600; color:#64748b; background:transparent; }
      .tab.active { background:#fff; color:#0f172a; }

      .field-label { display:block; font-size:14px; margin-bottom:6px; }
      .input-wrap { position:relative; margin-bottom:12px; }
      .input-icon { position:absolute; left:12px; top:10px; color:#94a3b8; }
      .input { width:100%; max-width:100%; box-sizing:border-box; padding:10px 12px 10px 36px; border-radius:8px; border:1px solid #d1d5db; outline:none; }

      .signin-btn { width:100%; max-width:100%; box-sizing:border-box; background:linear-gradient(135deg, #16398f, #1d4ed8); color:#fff; border:none; padding:10px 12px; border-radius:9999px; cursor:pointer; font-weight:700; box-shadow:0 6px 14px rgba(29,78,216,0.35); }
      .note { text-align:center; margin-top:12px; font-size:14px; color:#6b7280; }
      .note a { color:#2563eb; text-decoration:underline; }

      .demo-box { background:#f1f5f9; border:1px solid #e2e8f0; color:#0f172a; padding:12px; border-radius:10px; margin-top:14px; font-size:14px; }
      .demo-title { font-weight:700; margin-bottom:6px; }
      .demo-strong { font-weight:600; }

      .form-inner { width:100%; max-width:360px; margin:0 auto; }

      @media (max-width: 900px) {
        .left-panel { display:none; }
        .right-wrap { padding:16px; }
        .right-card { max-width: 480px; }
      }
    </style>
  </head>
  <body>
    <div id='root'></div>
    <script type='module' src='/src/main.jsx'></script>
  </body>
  </html>
